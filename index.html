<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<title>open chat</title>
		<meta name="description" content="">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="css/style.css">
		<script src="https://kit.fontawesome.com/6510466b6c.js" crossorigin="anonymous"></script>
	
	</head>
	<body>
		<main>
			<div class="chat-container">
				<div class="left">
					<div class="info">
						<div class="title-1">Room</div>
						<div id="room-name">open chat</div>
						<div class="title-2">Participants</div>
						<div id="user-list"></div>
					</div>
					<a href="/">
						<button>Clear all</button>
					</a>
				</div>
				<div class="right">
					<div id="messages"></div>
					<form id="form" action="" autocomplete="off">
						<input id="input" type="text" autofocus />
						<button type="submit">Send</button>
					</form>
				</div>
			</div>
		</main>
		<!-- <div class="mobile">
			<div class="container">
				<p class="txt">This application is not compatible on mobile devices, please view on a desktop</p>
			</div>
		</div> -->

		<script src="/socket.io/socket.io.js"></script>
		<script src="/moment.js"></script>
		<script src="/script.js"></script>
	</body>
</html>
