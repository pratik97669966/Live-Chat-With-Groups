<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>Open Talk 💬</title>
	<link rel="stylesheet" href="/style.min.css" />
	<link rel="icon" href="/favicon.ico" />
</head>

<body>
	<main>
		<div class="chat-container">
			<div class="left">

			</div>
			<div class="right">
				<div class="header">
					<img src="https://play-lh.googleusercontent.com/RTJBZnhKz_Q_iZK-kVR62LGmyX0Ehv0hht-AABmgb0t2nIN5ZjP8lJ1D3zt79XpqDg=w240-h480-rw"
						alt="logo" />
				
					
					<!-- Dark Mode and Online Users Button at the top -->
					<div class="d-flex justify-content-between mt-2">
						<!-- Dark Mode Toggle Switch -->
						<label class="dark-mode-switch">
							<input type="checkbox" id="dark-mode-toggle">
							<span class="slider"></span>
						</label>
						<!-- Online Users Counter -->
						<span class="tag is-success is-light" id="users-counter">Online: Loading...</span>
					</div>
					
				</div>
				<div id="messages"></div>
				<form id="form" action="" autocomplete="off">
					<input id="input" type="text" autofocus />
					<button type="submit">Send</button>
				</form>
			</div>
		</div>
	</main>
	<!-- <div class="mobile">
			<div class="container">
				<p class="txt">This application is not compatible on mobile devices, please view on a desktop</p>
			</div>
		</div> -->

	<script src="/socket.io/socket.io.js"></script>
	<script src="/moment.js"></script>
	<script src="/script.js"></script>
</body>

</html>
